# Build settings for the Docker image. The Dockerfile copies this file to
# /swg-main/local.properties inside the image.

# 64-bit build
bits = 64
compiler = gcc
src_build_type = RELEASE
oracle_home.64 = /usr/lib/oracle/21/client64
oracle_include.64 = /usr/include/oracle/21/client64
java_home.64 = /usr/lib/jvm/java-11-openjdk-amd64

# Database: the oracle service in docker-compose.yml
dbip = oracle
db_service = FREEPDB1
db_username = swg
db_password = swg
cluster_name = swg
